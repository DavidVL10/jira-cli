name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every failing interpreter, not just the first one.
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest

  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e '.[dev]'

      # Rules and target-version come from pyproject.toml, so this matches
      # what `ruff check` does locally.
      - name: Lint
        run: ruff check --output-format=github .

  no-runtime-dependencies:
    name: no runtime dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Deliberately without the [dev] extra: this job asks what a *user* gets.
      - name: Install
        run: pip install .

      - name: Assert the standard library is all we need
        run: |
          python - <<'PY'
          import sys
          from importlib.metadata import distributions

          # Packaging machinery present in a fresh environment regardless of
          # what we declare; anything else is a runtime dependency.
          ALLOWED = {"jira-cli", "pip", "setuptools", "wheel", "pkg-resources"}

          installed = {
              (d.metadata["Name"] or "").lower().replace("_", "-")
              for d in distributions()
          }
          installed.discard("")
          extra = sorted(installed - ALLOWED)

          if extra:
              sys.exit(
                  "Runtime dependencies found: " + ", ".join(extra) + "\n"
                  "This project declares dependencies = [] and uses the "
                  "standard library only."
              )

          print("OK, no runtime dependencies. Installed:", ", ".join(sorted(installed)))
          PY
